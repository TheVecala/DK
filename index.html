<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dušanova kapela</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #ffffff;
        }

        #container {
            text-align: center;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #00ff41;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
            width: fit-content;
            box-sizing: border-box; 
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 25px 0;
            color: #fff;
            text-shadow: 0 0 12px #fff;
            letter-spacing: 3px;
            white-space: normal; 
        }

        .status-icon {
            width: 120px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
            opacity: 0.4;
        }

        @media (max-width: 600px) {
            #container {
                padding: 20px;
                border-radius: 10px;
                max-width: 90%;
                width: auto;
            }
            h1 {
                font-size: 1.5rem;
                margin-bottom: 15px;
                text-shadow: 0 0 8px #fff;
            }
            .status-icon {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="container">
        <img src="music.png" alt="Kapela odpočívá" class="status-icon">
    </div>

    <canvas id="snakeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');

        // Seznam všech souborů s postavičkami
        const imageFiles = [
            'drinking.png', 'dancing.png', 'punk.png', 'rastafari.png',
            'drinking4.png', 'drinking3.png', 'drinking2.png', 'party.png',
            'champagne.png', 'dancers2.png', 'dancing2.png', 'dancers.png',
            'dance5.png', 'dance4.png', 'dance3.png', 'dance2.png',
            'breakdance2.png', 'breakdance.png', 'hip-hop.png', 'fan.png',
            'dance.png', 'fans.png'
        ];

        const loadedImages = [];
        let backgroundIcons = [];
        // Zvýšený počet postaviček pro pořádnou party
        let iconCount = window.innerWidth < 600 ? 20 : 35; 

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            iconCount = window.innerWidth < 600 ? 20 : 35; 
            if (loadedImages.length > 0) {
                generateIcons(); 
            }
        }
        window.addEventListener('resize', resize);

        function generateIcons() {
            backgroundIcons = [];
            const rect = container.getBoundingClientRect();
            const margin = window.innerWidth < 600 ? 20 : 50; 

            for (let i = 0; i < iconCount; i++) {
                let x, y, overlap;
                let attempts = 0;

                do {
                    x = Math.random() * (canvas.width - 60) + 30;
                    y = Math.random() * (canvas.height - 60) + 30;
                    overlap = (x > rect.left - margin && x < rect.right + margin &&
                               y > rect.top - margin && y < rect.bottom + margin);
                    attempts++;
                } while (overlap && attempts < 100);

                // Náhodný výběr obrázku ze seznamu načtených
                const randomImg = loadedImages[Math.floor(Math.random() * loadedImages.length)];

                backgroundIcons.push({
                    x: x,
                    y: y,
                    img: randomImg,
                    size: window.innerWidth < 600 ? 30 + Math.random() * 15 : 40 + Math.random() * 20 
                });
            }
        }

        const text = "DUŠANOVA KAPELA";
        const letters = text.split("");
        let spacing = window.innerWidth < 600 ? 20 : 30; 
        const speed = 2.8; 
        
        let snake = [];
        const startX = window.innerWidth / 2;
        const startY = window.innerHeight / 2;
        for(let i = 0; i < letters.length; i++) {
            snake.push({ x: startX - (i * spacing), y: startY }); 
        }

        let angle = Math.random() * Math.PI * 2;
        let targetAngle = angle;

        // --- Nová logika hromadného načítání obrázků ---
        let imagesLoaded = 0;
        let hasStarted = false;

        const startAnimation = () => {
            if (hasStarted) return; // Zabrání vícenásobnému spuštění
            hasStarted = true;
            resize();
            // Had se startuje po resize
            snake = [];
            for(let i = 0; i < letters.length; i++) {
                snake.push({ x: startX - (i * spacing), y: startY }); 
            }
            loop();
        };

        // Projdeme seznam a vytvoříme objekty Image
        imageFiles.forEach(file => {
            const img = new Image();
            img.src = file;
            img.onload = () => {
                imagesLoaded++;
                if (imagesLoaded === imageFiles.length) {
                    startAnimation();
                }
            };
            // I když se nějaký obrázek nepovede načíst, přidáme ho (na plátně se prostě nevykreslí)
            loadedImages.push(img);
        });

        // Fallback: Pokud se do 2 vteřin nenačtou všechny obrázky (např. chyba sítě), spustíme to s tím, co máme
        setTimeout(() => {
            if (!hasStarted) {
                startAnimation();
            }
        }, 2000);

        function update() {
            spacing = window.innerWidth < 600 ? 20 : 30;
            const head = { ...snake[0] };

            if (Math.random() < 0.02) {
                targetAngle += (Math.random() - 0.5) * 2;
            }
            angle += (targetAngle - angle) * 0.1;

            head.x += Math.cos(angle) * speed;
            head.y += Math.sin(angle) * speed;

            const padding = 40; 
            let reflected = false;

            if (head.x < padding) {
                head.x = padding; 
                angle = Math.PI - angle; 
                reflected = true;
            } else if (head.x > canvas.width - padding) {
                head.x = canvas.width - padding; 
                angle = Math.PI - angle; 
                reflected = true;
            }

            if (head.y < padding) {
                head.y = padding; 
                angle = -angle; 
                reflected = true;
            } else if (head.y > canvas.height - padding) {
                head.y = canvas.height - padding; 
                angle = -angle; 
                reflected = true;
            }

            if (reflected) {
                targetAngle = angle;
            }

            let newSnake = [head];
            for (let i = 1; i < snake.length; i++) {
                const prev = newSnake[i-1];
                const curr = snake[i];
                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                if (distance > spacing) {
                    const angleToPrev = Math.atan2(dy, dx);
                    curr.x = prev.x - Math.cos(angleToPrev) * spacing;
                    curr.y = prev.y - Math.sin(angleToPrev) * spacing;
                }
                newSnake.push({ x: curr.x, y: curr.y });
            }
            snake = newSnake;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            backgroundIcons.forEach(icon => {
                ctx.globalAlpha = 0.6; 
                if (icon.img && icon.img.complete) {
                    ctx.drawImage(icon.img, icon.x - icon.size/2, icon.y - icon.size/2, icon.size, icon.size);
                }
            });
            ctx.globalAlpha = 1.0;

            const baseFontSize = window.innerWidth < 600 ? 16 : 24;
            ctx.font = baseFontSize + 'px "Press Start 2P"';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            
            for (let i = snake.length - 1; i >= 0; i--) {
                const char = letters[i];
                const pos = snake[i];
                if (i === 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = window.innerWidth < 600 ? 12 : 20; 
                    ctx.shadowColor = '#00ff41';
                } else {
                    ctx.fillStyle = '#00ff41'; 
                    ctx.shadowBlur = window.innerWidth < 600 ? 6 : 10; 
                    ctx.shadowColor = '#00ff41';
                }
                ctx.fillText(char, pos.x, pos.y);
            }
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
