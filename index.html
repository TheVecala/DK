<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dušanova kapela - Již brzy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #ffffff;
        }

        #container {
            text-align: center;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #00ff41;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
            /* --- OPRAVA: Rámeček jen kolem obsahu --- */
            width: fit-content; 
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 25px 0;
            color: #fff;
            text-shadow: 0 0 12px #fff;
            letter-spacing: 3px;
            /* Zabrání zalomení textu, pokud by byl rámeček moc úzký */
            white-space: nowrap; 
        }

        .status-icon {
            width: 120px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="container">
        <h1>JIŽ BRZY</h1>
        <img src="music.png" alt="Kapela odpočívá" class="status-icon">
    </div>

    <canvas id="snakeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');

        // Načtení obrázků postaviček
        const imgDrinking = new Image();
        imgDrinking.src = 'drinking.png';
        const imgDancing = new Image();
        imgDancing.src = 'dancing.png';

        let backgroundIcons = [];
        const iconCount = 25; 

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateIcons(); 
        }
        window.addEventListener('resize', resize);

        function generateIcons() {
            backgroundIcons = [];
            const rect = container.getBoundingClientRect();
            const margin = 50; 

            for (let i = 0; i < iconCount; i++) {
                let x, y, overlap;
                let attempts = 0;

                do {
                    x = Math.random() * (canvas.width - 60) + 30;
                    y = Math.random() * (canvas.height - 60) + 30;
                    overlap = (x > rect.left - margin && x < rect.right + margin &&
                               y > rect.top - margin && y < rect.bottom + margin);
                    attempts++;
                } while (overlap && attempts < 100);

                backgroundIcons.push({
                    x: x,
                    y: y,
                    img: Math.random() > 0.5 ? imgDrinking : imgDancing,
                    size: 40 + Math.random() * 20 
                });
            }
        }

        const text = "DUŠANOVA KAPELA";
        const letters = text.split("");
        const spacing = 30; 
        const speed = 2.8; 
        
        let snake = [];
        // Začneme hada uprostřed, aby se hned neschoval
        const startX = window.innerWidth / 2;
        const startY = window.innerHeight / 2;
        for(let i = 0; i < letters.length; i++) {
            snake.push({ x: startX - (i * spacing), y: startY }); 
        }

        let angle = Math.random() * Math.PI * 2;
        let targetAngle = angle;

        let imagesLoaded = 0;
        const checkImagesAndStart = () => {
            imagesLoaded++;
            if (imagesLoaded === 2) {
                resize();
                loop();
            }
        };
        imgDrinking.onload = checkImagesAndStart;
        imgDancing.onload = checkImagesAndStart;

        // Pokud by se obrázky nenačetly (např. chybí soubory), spustíme to i tak po timeoutu
        setTimeout(() => {
            if (imagesLoaded < 2) {
                imagesLoaded = 2; // Vynutit start
                resize();
                loop();
            }
        }, 1000);

        function update() {
            const head = { ...snake[0] };

            // Náhodné plynulé zatáčení
            if (Math.random() < 0.02) {
                targetAngle += (Math.random() - 0.5) * 2;
            }
            // Plynulé otáčení k cílovému úhlu
            angle += (targetAngle - angle) * 0.1;

            head.x += Math.cos(angle) * speed;
            head.y += Math.sin(angle) * speed;

            // --- OPRAVA: Robustní kolize s okraji (okamžitý odraz a clip) ---
            const padding = 40; // Bezpečná zóna od okraje canvasu
            let reflected = false;

            // Kontrola horizontálních stěn
            if (head.x < padding) {
                head.x = padding; // Okamžitě posunout zpět do plochy
                angle = Math.PI - angle; // Okamžitý fyzikální odraz
                reflected = true;
            } else if (head.x > canvas.width - padding) {
                head.x = canvas.width - padding; // Okamžitě posunout zpět do plochy
                angle = Math.PI - angle; // Okamžitý fyzikální odraz
                reflected = true;
            }

            // Kontrola vertikálních stěn
            if (head.y < padding) {
                head.y = padding; // Okamžitě posunout zpět do plochy
                angle = -angle; // Okamžitý fyzikální odraz
                reflected = true;
            } else if (head.y > canvas.height - padding) {
                head.y = canvas.height - padding; // Okamžitě posunout zpět do plochy
                angle = -angle; // Okamžitý fyzikální odraz
                reflected = true;
            }

            // Pokud došlo k odrazu, srovnáme cílový úhel s novým úhlem, aby se had nezačal točit zpět do stěny
            if (reflected) {
                targetAngle = angle;
            }

            // Logika následování těla
            let newSnake = [head];
            for (let i = 1; i < snake.length; i++) {
                const prev = newSnake[i-1];
                const curr = snake[i];
                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                if (distance > spacing) {
                    const angleToPrev = Math.atan2(dy, dx);
                    curr.x = prev.x - Math.cos(angleToPrev) * spacing;
                    curr.y = prev.y - Math.sin(angleToPrev) * spacing;
                }
                newSnake.push({ x: curr.x, y: curr.y });
            }
            snake = newSnake;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            backgroundIcons.forEach(icon => {
                ctx.globalAlpha = 0.6; 
                if (icon.img.complete) {
                    ctx.drawImage(icon.img, icon.x - icon.size/2, icon.y - icon.size/2, icon.size, icon.size);
                }
            });
            ctx.globalAlpha = 1.0;

            ctx.font = '24px "Press Start 2P"';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            
            for (let i = snake.length - 1; i >= 0; i--) {
                const char = letters[i];
                const pos = snake[i];
                if (i === 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 20; 
                    ctx.shadowColor = '#00ff41';
                } else {
                    ctx.fillStyle = '#00ff41'; 
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff41';
                }
                ctx.fillText(char, pos.x, pos.y);
            }
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
