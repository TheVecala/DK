<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dušanova kapela - Již brzy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #ffffff;
        }

        /* Středový box */
        #container {
            text-align: center;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #00ff41;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 25px 0;
            color: #fff;
            text-shadow: 0 0 12px #fff;
            letter-spacing: 3px;
        }

        /* Ikona bez jakékoli záře */
        .status-icon {
            width: 120px;
            height: auto;
            display: block;
            margin: 0 auto;
            /* Filter byl odstraněn */
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="container">
        <h1>JIŽ BRZY</h1>
        <img src="music.png" alt="Kapela odpočívá" class="status-icon">
    </div>

    <canvas id="snakeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const text = "DUŠANOVA KAPELA";
        const letters = text.split("");
        const spacing = 30; 
        const speed = 2.8; 
        
        let snake = [];
        const startX = canvas.width / 2;
        const startY = canvas.height / 2;

        for(let i = 0; i < letters.length; i++) {
            snake.push({ x: startX - (i * spacing), y: startY });
        }

        let angle = Math.random() * Math.PI * 2;
        let targetAngle = angle;

        function update() {
            const head = { ...snake[0] };

            if (Math.random() < 0.02) {
                targetAngle += (Math.random() - 0.5) * 2;
            }
            
            angle += (targetAngle - angle) * 0.1;

            head.x += Math.cos(angle) * speed;
            head.y += Math.sin(angle) * speed;

            const padding = 40; 
            let hitWall = false;

            if (head.x < padding) { targetAngle = 0; hitWall = true; }
            else if (head.x > canvas.width - padding) { targetAngle = Math.PI; hitWall = true; }

            if (head.y < padding) { targetAngle = Math.PI / 2; hitWall = true; }
            else if (head.y > canvas.height - padding) { targetAngle = -Math.PI / 2; hitWall = true; }

            if (hitWall) angle = targetAngle;

            let newSnake = [head];
            for (let i = 1; i < snake.length; i++) {
                const prev = newSnake[i-1];
                const curr = snake[i];
                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance > spacing) {
                    const angleToPrev = Math.atan2(dy, dx);
                    curr.x = prev.x - Math.cos(angleToPrev) * spacing;
                    curr.y = prev.y - Math.sin(angleToPrev) * spacing;
                }
                newSnake.push({ x: curr.x, y: curr.y });
            }
            snake = newSnake;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '24px "Press Start 2P"';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            
            for (let i = snake.length - 1; i >= 0; i--) {
                const char = letters[i];
                const pos = snake[i];
                
                if (i === 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 20; 
                    ctx.shadowColor = '#00ff41';
                } else {
                    ctx.fillStyle = '#00ff41'; 
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff41';
                }
                
                ctx.fillText(char, pos.x, pos.y);
            }
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
